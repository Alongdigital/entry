
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Damodar Academy</title>
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="login-body">

    <main class="login-wrapper">

        <section class="login-brand">
            <div class="brand-icon">DA</div>
            <h1>Damodar Academy</h1>
            <p>Administration Portal</p>
            <div class="brand-line"></div>
            <h2>Manage your academy.</h2>
            <p class="brand-description">
                A centralized platform for managing students,
                admissions and academy operations.
            </p>
        </section>

        <section class="login-panel">
            <div class="login-heading">
                <span class="eyebrow">WELCOME BACK</span>
                <h2>Admin Login</h2>
                <p>Sign in to access your dashboard.</p>
            </div>

            <form id="loginForm">

                <label for="role">Login As</label>
                <select id="role" required>
                    <option value="owner">Academy Owner</option>
                    <option value="developer">Developer</option>
                </select>

                <label for="email">Email Address</label>
                <input type="email" id="email"
                    placeholder="Enter your email" required>

                <label for="password">Password</label>
                <input type="password" id="password"
                    placeholder="Enter your password" required>

                <button type="submit" class="primary-btn">
                    Sign In <span>→</span>
                </button>

                <p id="loginMessage" class="form-message"></p>
            </form>

            <div class="login-footer">
                © 2026 Damodar Academy. All rights reserved.
            </div>
        </section>

    </main>

    <script src="assets/js/admin.js"></script>
</body>
</html>
